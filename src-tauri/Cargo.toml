[package]
name = "salt-player"
version = "0.1.0-alpha"
edition = "2021"
description = "Salt Player for Linux"
license = "MIT"
authors = ["Corripo <corripo@pu.edu.kg>"]

[lib]
name = "salt_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
walkdir = "2"
lofty = "0.21"
rodio = "0.19"
rand = "0.8"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
