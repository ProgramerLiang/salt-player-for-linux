name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Compile
        run: ./gradlew :app:compileKotlin --no-daemon

      - name: Test
        run: ./gradlew :app:test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/test

      - name: Build all Linux packages
        run: |
          ./gradlew :app:packageDeb :app:packageRpm :app:packageAppImage :app:packageTarGz --no-daemon

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: salt-player-linux
          path: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
            app/build/compose/binaries/main/appimage/*.AppImage
            app/build/compose/binaries/main/tar.gz/*.tar.gz
          if-no-files-found: error
