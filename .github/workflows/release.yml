name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm zstd libarchive-tools
      - name: Build all packages
        run: ./gradlew :app:packageDeb :app:packageRpm :app:packageAppImage :app:packageTarGz :app:packageArch --no-daemon
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
            app/build/compose/binaries/main/appimage/*.AppImage
            app/build/compose/binaries/main/tar.gz/*.tar.gz
            app/build/compose/binaries/main/arch/*.pkg.tar.zst
